<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Écran Render</title>
  <style>
    body {
      margin: 0;
      background-color: #0f172a;
      color: white;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      color: #38bdf8;
      margin-bottom: 10px;
    }
    #heure {
      font-size: 2.5rem;
      color: #4ade80;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Écran en ligne !</h1>
    <p>Créé depuis mon Samsung A14</p>
    <div id="heure"></div>
  </div>

  <script>
    function majHeure() {
      document.getElementById('heure').innerText = new Date().toLocaleTimeString('fr-FR');
    }
    setInterval(majHeure, 1000);
    majHeure();
  </script>
</body>
</html>
